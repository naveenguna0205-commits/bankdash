<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dual Credit Cards Icon -->
  <g id="bankdash-icon">
    <!-- Back Card -->
    <rect x="8" y="5.5" width="22" height="17" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Front Card -->
    <rect x="2.5" y="12" width="22" height="17" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Magnetic Line -->
    <path d="M3 17.5H24" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Rose Chip Accent -->
    <rect x="12.5" y="22" width="8" height="3.5" rx="1.75" fill="#F43F5E"/>
  </g>
  <!-- Text BankDash. -->
  <text x="38" y="27.5" fill="#0F172A" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">BankDash.</text>
</svg>
